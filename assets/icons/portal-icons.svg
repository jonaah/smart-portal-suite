<svg xmlns="http://www.w3.org/2000/svg" style="display: none;" aria-hidden="true">
  <defs>
    <!-- Freistehendes Haus / Einfamilienhaus -->
    <symbol id="icon-house-single" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </symbol>

    <!-- Reihenhaus / Reihenmittelhaus -->
    <symbol id="icon-house-row-middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 10l5-4 5 4v10H2z"/>
      <path d="M12 10l5-4 5 4v10h-10z"/>
    </symbol>

    <!-- Doppelhaushälfte / Reihenendhaus -->
    <symbol id="icon-house-semi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10l6-5 6 5v10H3z"/>
      <path d="M15 10l6-5v15h-6"/>
      <line x1="9" y1="20" x2="9" y2="14"/>
    </symbol>

    <!-- Mehrfamilienhaus / Wohngebäude -->
    <symbol id="icon-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
      <line x1="9" y1="6" x2="9" y2="6.01"/>
      <line x1="15" y1="6" x2="15" y2="6.01"/>
      <line x1="9" y1="10" x2="9" y2="10.01"/>
      <line x1="15" y1="10" x2="15" y2="10.01"/>
      <line x1="9" y1="14" x2="9" y2="14.01"/>
      <line x1="15" y1="14" x2="15" y2="14.01"/>
      <line x1="9" y1="18" x2="15" y2="18"/>
    </symbol>

    <!-- Sanierung / Werkzeug -->
    <symbol id="icon-renovation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </symbol>

    <!-- Heizung / Flamme / Wärmepumpe -->
    <symbol id="icon-heating" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
    </symbol>

    <!-- Solar / Photovoltaik -->
    <symbol id="icon-solar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/>
      <path d="m19.07 4.93-1.41 1.41"/>
    </symbol>

    <!-- Fenster / Dämmung -->
    <symbol id="icon-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <line x1="12" y1="3" x2="12" y2="21"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
    </symbol>

    <!-- Dach / Dachsanierung -->
    <symbol id="icon-roof" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 14 10-9 10 9"/>
      <path d="M6 10.5V5h3v2.2"/>
    </symbol>

    <!-- Keller / Kellerdecke -->
    <symbol id="icon-basement" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="7" y1="6" x2="7" y2="11"/>
      <line x1="17" y1="6" x2="17" y2="11"/>
    </symbol>

    <!-- Dokument / iSFP / Zertifikat -->
    <symbol id="icon-document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </symbol>

    <!-- Euro / Finanzierung / Kosten -->
    <symbol id="icon-euro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10h12"/>
      <path d="M4 14h9"/>
      <path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12a7.9 7.9 0 0 0 7.8 8 7.7 7.7 0 0 0 5.2-2"/>
    </symbol>

    <!-- Eigennutzung (Person) -->
    <symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </symbol>

    <!-- Vermietung (Mehrere Personen) -->
    <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>

    <!-- Checkmark / Erfolg -->
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>

    <!-- Upload -->
    <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </symbol>

    <!-- Kalender -->
    <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </symbol>

    <!-- ========================================== -->
    <!-- Abwärtskompatibilitäts-Aliase (ohne 'icon-') -->
    <!-- ========================================== -->
    <symbol id="house-single" viewBox="0 0 24 24"><use href="#icon-house-single"/></symbol>
    <symbol id="house-row-middle" viewBox="0 0 24 24"><use href="#icon-house-row-middle"/></symbol>
    <symbol id="house-semi" viewBox="0 0 24 24"><use href="#icon-house-semi"/></symbol>
    <symbol id="building" viewBox="0 0 24 24"><use href="#icon-building"/></symbol>
    <symbol id="renovation" viewBox="0 0 24 24"><use href="#icon-renovation"/></symbol>
    <symbol id="heating" viewBox="0 0 24 24"><use href="#icon-heating"/></symbol>
    <symbol id="solar" viewBox="0 0 24 24"><use href="#icon-solar"/></symbol>
    <symbol id="window" viewBox="0 0 24 24"><use href="#icon-window"/></symbol>
    <symbol id="roof" viewBox="0 0 24 24"><use href="#icon-roof"/></symbol>
    <symbol id="basement" viewBox="0 0 24 24"><use href="#icon-basement"/></symbol>
    <symbol id="document" viewBox="0 0 24 24"><use href="#icon-document"/></symbol>
    <symbol id="euro" viewBox="0 0 24 24"><use href="#icon-euro"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><use href="#icon-user"/></symbol>
    <symbol id="users" viewBox="0 0 24 24"><use href="#icon-users"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><use href="#icon-check"/></symbol>
    <symbol id="upload" viewBox="0 0 24 24"><use href="#icon-upload"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><use href="#icon-calendar"/></symbol>
  </defs>
</svg>
